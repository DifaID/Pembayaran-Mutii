<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pembayaran QRIS</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f5f5f5;
      font-family: Arial, sans-serif;
    }

    .container {
      text-align: center;
      background: white;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
      width: 85%;
      max-width: 400px;
    }

    h1 {
      margin-bottom: 20px;
    }

    .qris {
      width: 100%;
      max-width: 320px;
      border-radius: 10px;
    }

    p {
      color: #555;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Pembayaran QRIS</h1>

    <img
      src="qris.png"
      alt="QRIS Pembayaran"
      class="qris"
    >

    <p>Silakan scan QRIS untuk melakukan pembayaran.</p>
  </div>

</body>
</html>
